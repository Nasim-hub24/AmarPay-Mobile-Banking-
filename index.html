
<!DOCTYPE html>
<html lang="en" data-theme="silk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> AmarPay</title>

    <!-- daisy ui and tailwind -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- fonts OUTFIT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"     rel="stylesheet">

    <!-- font awesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

     <!-- adding theme -->
      <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

    <style>
        *{
            font-family: "Outfit", sans-serif;
        }
    </style>

</head>
<body class="min-h-screen max-w-md bg-gray-100 mx-auto">
    <div class="logo w-[300px] pt-16 mx-auto">
        <img src="assets/pay.png" alt="">
    </div>
    <div>
        <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-xl mx-auto rounded-2xl">
            <div class="card-body">
                <fieldset class="fieldset">
                  <label class="label font-bold text-neutral-950 text-lg">Mobile Number</label>
                  <input maxlength="11" minlength="11" type="text" class="input rounded-full bg-base-200 " placeholder="Enter your number" />

                    <br>

                  <label class="label font-bold text-neutral-950 text-lg">Set pin</label>
                  <input maxlength="4" minlength="4" type="password" class="input rounded-full bg-base-200 " placeholder="Enter 4 digit pin" />
                  <button id="login-btn" class="btn btn-primary mt-4 rounded-full">Login</button>
                </fieldset>
            </div>
        </div>        
    </div>


    <script type="module" src="SCRIPT JS/login.js"></script>
</body>
</html>
